name: Build Release Test

on:
  push:
    branches: [ "main", "master", "beta" ]
  pull_request:
    branches: [ "main", "master", "beta" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.2', '8.4' ]
        database:
          - name: mysql
            image: mysql:8.0
          - name: mariadb
            image: mariadb:10.11
    services:
      mysql:
        image: ${{ matrix.database.image }}
        env:
          MYSQL_DATABASE: my_photo_gallery_test
          MYSQL_USER: gallery_user
          MYSQL_PASSWORD: gallery_password
          MYSQL_ROOT_PASSWORD: root_password
          MARIADB_DATABASE: my_photo_gallery_test
          MARIADB_USER: gallery_user
          MARIADB_PASSWORD: gallery_password
          MARIADB_ROOT_PASSWORD: root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: test
      APP_DEBUG: "false"
      APP_URL: http://mygallery
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: my_photo_gallery_test
      DB_USER: gallery_user
      DB_PASSWORD: gallery_password
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: 3306
      TEST_DB_NAME: my_photo_gallery_test
      TEST_DB_USER: gallery_user
      TEST_DB_PASSWORD: gallery_password
      REQUIRE_TEST_DB: "1"

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, fileinfo, gd, pdo_mysql, exif, zip

      - name: Lint PHP files
        run: find . -name '*.php' -not -path './dist/*' -print0 | xargs -0 -n1 php -l

      - name: Check JavaScript syntax
        run: node --check public/assets/js/main.js

      - name: Prepare database config
        run: cp config/database.example.php config/database.php

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            php -r 'try { new PDO("mysql:host=127.0.0.1;port=3306;dbname=my_photo_gallery_test;charset=utf8mb4", "gallery_user", "gallery_password", [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]); exit(0); } catch (Throwable $e) { fwrite(STDERR, "."); exit(1); }' && exit 0
            sleep 2
          done
          echo "MySQL did not become ready in time" >&2
          exit 1

      - name: Load schema and migrations
        run: |
          mysql -h127.0.0.1 -P3306 -ugallery_user -pgallery_password my_photo_gallery_test < database/schema.sql
          php tools/migrate.php

      - name: Run self-check
        run: php tools/self_check.php

      - name: Run tests
        run: php tests/run.php

      - name: Verify backup and restore round-trip
        run: |
          php tests/fixtures/seed_backup_fixture.php /tmp/mygallery_fixture_snapshot.json
          php tests/fixtures/assert_backup_fixture.php /tmp/mygallery_fixture_snapshot.json
          php tools/backup.php --output=/tmp/mygallery_ci_backup.zip
          php tools/verify_backup.php /tmp/mygallery_ci_backup.zip
          printf 'RESTORE\n' | php tools/restore.php /tmp/mygallery_ci_backup.zip
          php tests/fixtures/assert_backup_fixture.php /tmp/mygallery_fixture_snapshot.json
          php tools/self_check.php
          rm /tmp/mygallery_ci_backup.zip
          rm /tmp/mygallery_fixture_snapshot.json

      - name: Run HTTP smoke tests
        run: |
          APP_URL=http://127.0.0.1:8080 php -S 127.0.0.1:8080 -t public >/tmp/mygallery_http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in {1..20}; do
            curl --fail --silent --show-error http://127.0.0.1:8080/index.php -o /tmp/mygallery_index.html && break
            sleep 1
          done
          curl --fail --silent --show-error --dump-header /tmp/mygallery_headers.txt http://127.0.0.1:8080/index.php -o /tmp/mygallery_index.html
          grep -qi '^Content-Security-Policy:' /tmp/mygallery_headers.txt
          grep -qi '^X-Content-Type-Options: nosniff' /tmp/mygallery_headers.txt
          grep -q 'Персональна фотогалерея' /tmp/mygallery_index.html
          curl --fail --silent --show-error http://127.0.0.1:8080/admin/login.php -o /tmp/mygallery_login.html
          grep -q '<form' /tmp/mygallery_login.html
          test "$(curl --silent --output /tmp/mygallery_missing.html --write-out '%{http_code}' http://127.0.0.1:8080/missing-route)" = '404'

      - name: Build release ZIP
        run: php tools/build_release.php

      - name: Verify release ZIP contents
        run: |
          php -r '
          $zips = glob("dist/mygallery_*_release.zip") ?: [];
          if (count($zips) !== 1) {
              fwrite(STDERR, "Expected exactly one release ZIP, found " . count($zips) . PHP_EOL);
              exit(1);
          }
          $zip = new ZipArchive();
          if ($zip->open($zips[0]) !== true) {
              fwrite(STDERR, "Could not open release ZIP" . PHP_EOL);
              exit(1);
          }
          for ($i = 0; $i < $zip->numFiles; $i++) {
              $name = str_replace("\\\\", "/", (string) $zip->getNameIndex($i));
              $withoutRoot = preg_replace("#^[^/]+/#", "", trim($name, "/")) ?: trim($name, "/");
              $base = basename($withoutRoot);
              $allowedRuntimePlaceholders = $base === ".gitkeep" || in_array($withoutRoot, [
                  "public/uploads/originals/.htaccess",
                  "public/uploads/large/.htaccess",
                  "public/uploads/thumbnails/.htaccess",
              ], true);
              $forbidden = [
                  "#(^|/)\\.git(/|$)#",
                  "#(^|/)config/database\\.php$#",
                  "#(^|/)\\.env$#",
                  "#(^|/)temp_[^/]*\\.php$#i",
                  "#(^|/)sess_[^/]*$#",
                  "#\\.(log|bak|backup|tmp|zip)$#i",
                  "#(^|/)storage/originals/.+\\.(jpe?g|png|webp|avif)$#i",
                  "#(^|/)public/uploads/(large|thumbnails|originals)/.+\\.(jpe?g|png|webp|avif)$#i",
                  "#(^|/)storage/(logs|sessions|trash|download_locks|share_ratelimit)/.+#",
                  "#(^|/)storage/(restore_journal\\.json|media_maintenance\\.lock)$#",
                  "#(^|/)\\.restore-(stage|old|discard)-#",
                  "#(^|/)(AGENTS|CLAUDE|GEMINI|FULL_PROJECT_AUDIT)\\.md$#i",
                  "#(^|/)[^/]*(audit|prompt)[^/]*\\.md$#i",
              ];
              foreach ($forbidden as $pattern) {
                  if (preg_match($pattern, $withoutRoot) && !$allowedRuntimePlaceholders) {
                      fwrite(STDERR, "Forbidden release entry: {$withoutRoot}" . PHP_EOL);
                      exit(1);
                  }
              }
          }
          $zip->close();
          echo "Release ZIP content verification passed" . PHP_EOL;
          '

      - name: Verify release provenance and reproducibility
        run: |
          php -r '
          $zips = glob("dist/mygallery_*_release.zip") ?: [];
          if (count($zips) !== 1) exit(1);
          $expected = explode(" ", trim((string) file_get_contents($zips[0] . ".sha256")))[0] ?? "";
          $provenance = json_decode((string) file_get_contents($zips[0] . ".provenance.json"), true);
          if (!hash_equals(hash_file("sha256", $zips[0]), $expected)
              || !is_array($provenance)
              || !hash_equals($expected, (string) ($provenance["artifact_sha256"] ?? ""))
              || ($provenance["source_commit_reachable"] ?? false) !== true
              || ($provenance["source_dirty"] ?? true) !== false) {
              fwrite(STDERR, "Release provenance verification failed" . PHP_EOL);
              exit(1);
          }
          '
          php tools/build_release.php --output=/tmp/mygallery_repro_a.zip
          php tools/build_release.php --output=/tmp/mygallery_repro_b.zip
          cmp /tmp/mygallery_repro_a.zip /tmp/mygallery_repro_b.zip
          rm /tmp/mygallery_repro_a.zip*
          rm /tmp/mygallery_repro_b.zip*

  webserver-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server: [ apache, nginx ]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: my_photo_gallery_web_test
          MYSQL_USER: gallery_user
          MYSQL_PASSWORD: gallery_password
          MYSQL_ROOT_PASSWORD: root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Prepare webserver test database
        run: |
          cp config/database.example.php config/database.php
          mysql -h127.0.0.1 -P3306 -ugallery_user -pgallery_password my_photo_gallery_web_test < database/schema.sql
          sudo chown -R 33:33 storage public/uploads

      - name: Build and start Apache
        if: matrix.server == 'apache'
        run: |
          docker build -f .github/ci/Dockerfile.apache -t mygallery-apache-ci .
          docker run -d --name gallery-apache --add-host=host.docker.internal:host-gateway -p 8081:80 \
            -v "$PWD:/var/www/mygallery" \
            -e APP_ENV=local -e APP_DEBUG=false -e APP_URL=http://127.0.0.1:8081 \
            -e DB_HOST=host.docker.internal -e DB_PORT=3306 -e DB_NAME=my_photo_gallery_web_test \
            -e DB_USER=gallery_user -e DB_PASSWORD=gallery_password mygallery-apache-ci

      - name: Build and start Nginx with PHP-FPM
        if: matrix.server == 'nginx'
        run: |
          docker network create gallery-ci
          docker build -f .github/ci/Dockerfile.fpm -t mygallery-fpm-ci .
          docker run -d --name gallery-fpm --network gallery-ci --add-host=host.docker.internal:host-gateway \
            -v "$PWD:/var/www/mygallery" \
            -e APP_ENV=local -e APP_DEBUG=false -e APP_URL=http://127.0.0.1:8081 \
            -e DB_HOST=host.docker.internal -e DB_PORT=3306 -e DB_NAME=my_photo_gallery_web_test \
            -e DB_USER=gallery_user -e DB_PASSWORD=gallery_password mygallery-fpm-ci
          docker run -d --name gallery-nginx --network gallery-ci -p 8081:80 \
            -v "$PWD:/var/www/mygallery:ro" \
            -v "$PWD/.github/ci/nginx.conf:/etc/nginx/conf.d/default.conf:ro" nginx:1.27-alpine

      - name: Verify real webserver security behavior
        run: |
          for i in {1..60}; do
            curl --fail --silent http://127.0.0.1:8081/index.php -o /tmp/web-index.html && break
            sleep 2
          done
          curl --fail --silent --dump-header /tmp/web-headers.txt http://127.0.0.1:8081/index.php -o /tmp/web-index.html
          grep -qi '^Content-Security-Policy:' /tmp/web-headers.txt
          grep -qi '^X-Content-Type-Options: nosniff' /tmp/web-headers.txt
          test "$(curl --silent --output /tmp/upload-denied --write-out '%{http_code}' http://127.0.0.1:8081/uploads/large/.gitkeep)" = '403'
          test "$(curl --silent --output /tmp/assets-dotfile-denied --write-out '%{http_code}' http://127.0.0.1:8081/assets/.htaccess)" = '403'
          curl --fail --silent http://127.0.0.1:8081/assets/css/style.css -o /tmp/web-style.css
          test "$(curl --silent --output /tmp/web-missing --write-out '%{http_code}' http://127.0.0.1:8081/missing-route)" = '404'
          test "$(curl --silent --output /tmp/web-unknown-php --write-out '%{http_code}' http://127.0.0.1:8081/unknown.php)" = '404'

      - name: Show container logs on failure
        if: failure()
        run: docker logs gallery-apache 2>/dev/null || docker logs gallery-fpm 2>/dev/null || true

      - name: Stop webserver containers
        if: always()
        run: |
          docker rm -f gallery-apache gallery-nginx gallery-fpm 2>/dev/null || true
          docker network rm gallery-ci 2>/dev/null || true
